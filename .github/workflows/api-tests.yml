name: API tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 10 * * 1-5"   # weekdays, full regression
  workflow_dispatch:
    inputs:
      groups:
        description: "Test group to run: smoke or regression"
        default: regression
      env:
        description: "Environment: mock or uat"
        default: mock

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pull requests run the quick smoke group; everything else runs the full regression
      GROUPS: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.groups || 'regression' }}
      TEST_ENV: ${{ inputs.env || 'mock' }}
      # Only needed for real environments (uat); add them under Settings > Secrets and variables > Actions
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4   # Allure 3 report generator runs on Node.js
        with:
          node-version: "22"

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: mvn -B -ntp test -Denv="$TEST_ENV" -Dgroups="$GROUPS"

      - name: Build Allure report
        if: always()
        continue-on-error: true
        run: mvn -B -ntp allure:report

      - name: Combine both reports into one site
        if: always()
        run: |
          mkdir -p site/extent site/allure
          cp -r target/extent-report/. site/extent/ 2>/dev/null || true
          cp -r target/site/allure-maven-plugin/. site/allure/ 2>/dev/null || true
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Payments API test reports</title>
          <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;color:#1F3D6B}
          a{display:block;margin:14px 0;padding:16px;border:1px solid #2F5D94;border-radius:8px;color:#2F5D94;text-decoration:none}
          a:hover{background:#F3F6FA}small{color:#5F6B7A}</style></head><body>
          <h1>Payments API test reports</h1>
          <a href="allure/index.html"><b>Allure report</b><br><small>Interactive: steps, request and response attachments, filters, timeline, failure categories</small></a>
          <a href="extent/index.html"><b>Extent report</b><br><small>Single page: every test with its API calls, easy to save and share</small></a>
          </body></html>
          HTML

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            site/
            target/surefire-reports/
          retention-days: 30

      - name: Prepare reports for GitHub Pages
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Fail the build if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed. Open the Allure or Extent report (artifact or GitHub Pages) for details."
          exit 1

  publish-report:
    needs: test
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish reports to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
