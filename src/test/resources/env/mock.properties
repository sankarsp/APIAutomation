# Built-in mock API (WireMock). base.url and auth.url are set at run time to the mock's random port.
base.url=http://localhost
auth.url=http://localhost
auth.path=/oauth2/token
# Demo credentials for the mock only. Real environments read CLIENT_ID / CLIENT_SECRET from environment variables.
client.id=mock-client
client.secret=mock-secret
max.response.ms=2000
